name: CI

# Independent green signal for every PR and every push to main. Mirrors the
# commands in the README so local and CI stay in step.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Create venv and install dev dependencies
        run: |
          uv venv
          uv pip install -r requirements-dev.txt

      - name: Run tests
        run: uv run pytest -q

  frontend-lint:
    name: frontend lint (oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
